name: Add to Internal Testers

on:
  workflow_dispatch:
    inputs:
      tester_id:
        required: true
      email:
        required: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JWT
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/gen_jwt.js << 'JSEOF'
          const crypto = require('node:crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKeyPem = Buffer.from(process.env.ASC_KEY_P8, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);
          const now = Math.floor(Date.now() / 1000);
          const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
          const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
          const input = `${hdr}.${pay}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          JSEOF
          node /tmp/gen_jwt.js > /tmp/jwt.txt

      - name: Add to Internal Testers group
        env:
          TESTER_ID: ${{ inputs.tester_id }}
          EMAIL: ${{ inputs.email }}
        run: |
          JWT=$(cat /tmp/jwt.txt)
          BASE="https://api.appstoreconnect.apple.com/v1"
          INTERNAL_GROUP_ID="29392d02-f5ea-4f47-a38a-bfbaf56f3c66"

          echo "Adding tester ${EMAIL} (${TESTER_ID}) to Internal Testers group..."
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Content-Type: application/json" \
            "${BASE}/betaGroups/${INTERNAL_GROUP_ID}/relationships/betaTesters" \
            -d "{\"data\":[{\"type\":\"betaTesters\",\"id\":\"${TESTER_ID}\"}]}")

          echo "HTTP: ${HTTP}"
          cat /tmp/resp.json | jq . 2>/dev/null || cat /tmp/resp.json

          if [ "$HTTP" = "204" ]; then
            echo ""
            echo "SUCCESS — ${EMAIL} added to Internal Testers."
            echo "GigTrotter will now appear in their TestFlight immediately."
          else
            echo "Failed — see response above."
            exit 1
          fi
