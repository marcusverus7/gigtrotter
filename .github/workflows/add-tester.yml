name: Add TestFlight Tester

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Tester email address"
        required: true
      first_name:
        description: "First name"
        required: false
        default: "Kieran"
      last_name:
        description: "Last name"
        required: false
        default: "McParland"

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JWT
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/gen_jwt.js << 'JSEOF'
          const crypto = require('node:crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKeyPem = Buffer.from(process.env.ASC_KEY_P8, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);
          const now = Math.floor(Date.now() / 1000);
          const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
          const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
          const input = `${hdr}.${pay}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          JSEOF
          node /tmp/gen_jwt.js > /tmp/jwt.txt
          echo "JWT ready"

      - name: Add tester directly to Public Beta group
        env:
          EMAIL: ${{ inputs.email }}
          FIRST_NAME: ${{ inputs.first_name }}
          LAST_NAME: ${{ inputs.last_name }}
        run: |
          JWT=$(cat /tmp/jwt.txt)
          BASE="https://api.appstoreconnect.apple.com/v1"
          PUBLIC_BETA_GROUP_ID="374b7066-0612-44ff-aaf3-52d644bd988b"

          # Build JSON with node to avoid escaping issues
          PAYLOAD=$(node -e "
            process.stdout.write(JSON.stringify({
              data: {
                type: 'betaTesters',
                attributes: {
                  email: process.env.EMAIL,
                  firstName: process.env.FIRST_NAME,
                  lastName: process.env.LAST_NAME
                },
                relationships: {
                  betaGroups: {
                    data: [{ type: 'betaGroups', id: '$PUBLIC_BETA_GROUP_ID' }]
                  }
                }
              }
            }))
          ")

          echo "Adding ${EMAIL} to Public Beta group..."
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Content-Type: application/json" \
            "${BASE}/betaTesters" \
            -d "${PAYLOAD}")

          echo "HTTP status: ${HTTP}"
          cat /tmp/resp.json | jq . || cat /tmp/resp.json

          if [ "$HTTP" = "201" ]; then
            echo ""
            echo "=========================================="
            echo "SUCCESS"
            echo "${EMAIL} has been invited to the Public Beta group."
            echo "They will receive a TestFlight invitation email shortly."
            echo "They can install the build once Beta App Review passes."
            echo "=========================================="
          elif [ "$HTTP" = "409" ]; then
            echo ""
            echo "Tester already exists — trying to add to group directly..."
            TESTER_ID=$(cat /tmp/resp.json | jq -r '.errors[0].source.pointer // empty' || echo "")
            # Get existing tester by email and add to group
            EXISTING=$(curl -sg -H "Authorization: Bearer ${JWT}" \
              "${BASE}/betaTesters?filter%5Bemail%5D=${EMAIL}&fields%5BbetaTesters%5D=email,firstName,lastName")
            echo "$EXISTING" | jq .
            TESTER_ID=$(echo "$EXISTING" | jq -r '.data[0].id // empty')
            if [ -n "$TESTER_ID" ]; then
              echo "Found tester ID: $TESTER_ID — adding to group..."
              ADD=$(curl -s -o /tmp/add_resp.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer ${JWT}" \
                -H "Content-Type: application/json" \
                "${BASE}/betaGroups/${PUBLIC_BETA_GROUP_ID}/relationships/betaTesters" \
                -d "{\"data\":[{\"type\":\"betaTesters\",\"id\":\"${TESTER_ID}\"}]}")
              echo "HTTP: $ADD"
              cat /tmp/add_resp.json
              echo ""
              echo "=========================================="
              echo "SUCCESS — ${EMAIL} added to Public Beta group."
              echo "They will receive a TestFlight invitation email shortly."
              echo "=========================================="
            fi
          else
            echo "Unexpected error — see response above."
            exit 1
          fi
