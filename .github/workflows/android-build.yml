name: Android Build & Distribute

# Builds the Capacitor Android shell on Ubuntu (Android SDK pre-installed).
# Outputs a debug APK as a workflow artifact.
# To get a shareable Firebase testing link, set FIREBASE_APP_ID +
# FIREBASE_SERVICE_ACCOUNT_JSON secrets and uncomment the distribution step.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "ios-shell/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact (30-day download)
        uses: actions/upload-artifact@v4
        with:
          name: gigtrotter-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create public GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "GigTrotter Android Build ${{ github.run_number }}"
          body: |
            **Debug APK for Android testing**

            1. Download `app-debug.apk` below
            2. On your Android device: Settings → Apps → Install unknown apps → allow your browser
            3. Open the downloaded file to install

            Built from commit ${{ github.sha }} by run #${{ github.run_number }}.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
