name: Android Build & Distribute

# Builds the Capacitor Android shell on Ubuntu (Android SDK pre-installed)
# and uploads a debug APK. When FIREBASE_APP_ID + FIREBASE_SERVICE_ACCOUNT_JSON
# secrets are set, also distributes via Firebase App Distribution, which
# generates a shareable testing link visible in the Firebase Console.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "ios-shell/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK for distribution
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gigtrotter.apk

      - name: Upload APK artifact (30-day download)
        uses: actions/upload-artifact@v4
        with:
          name: gigtrotter-android
          path: gigtrotter.apk
          retention-days: 30

      - name: Distribute via Firebase App Distribution
        if: secrets.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: gigtrotter.apk
          releaseNotes: "Build ${{ github.run_number }} — ${{ github.sha }}"
