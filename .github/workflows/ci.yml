name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts skips post-install scripts. The deps that need
        # them (sharp, core-js, unrs-resolver) work fine without — Next.js
        # provides its own image pipeline fallback and the rest are
        # bundled polyfills.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Catches writes to service-role-only tables made with the session
      # client. RLS denies those silently — no error, no row — and the bug
      # shipped three times (every confirmed gig had venue_id null, so the
      # map stayed empty) before it was noticed.
      - name: Guard service-role-only writes
        run: pnpm check:rls

      # Deterministic capture-pipeline tests: MIME sniffing, fail-closed PDF
      # handling, the parse schema contract and the eval scorer. No API key
      # needed, so this runs on every push unlike the full corpus eval.
      - name: Capture logic tests
        run: pnpm test:logic

      - name: Build
        run: pnpm build
        env:
          # Build must succeed without real secrets; the app degrades
          # gracefully when integrations are unconfigured.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
