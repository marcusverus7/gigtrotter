name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts skips post-install scripts. The deps that need
        # them (sharp, core-js, unrs-resolver) work fine without — Next.js
        # provides its own image pipeline fallback and the rest are
        # bundled polyfills.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Build must succeed without real secrets; the app degrades
          # gracefully when integrations are unconfigured.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
