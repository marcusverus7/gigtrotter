name: Enable Feedback on All Apps

on:
  workflow_dispatch:

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JWT
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/gen_jwt.js << 'JSEOF'
          const crypto = require('node:crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKeyPem = Buffer.from(process.env.ASC_KEY_P8, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);
          const now = Math.floor(Date.now() / 1000);
          const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
          const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
          const input = `${hdr}.${pay}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          JSEOF
          node /tmp/gen_jwt.js > /tmp/jwt.txt
          echo "JWT ready"

      - name: Enable feedbackEnabled on all beta groups for all apps
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/enable_feedback.js << 'JSEOF'
          const https = require('node:https');
          const crypto = require('node:crypto');

          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKeyPem = Buffer.from(process.env.ASC_KEY_P8, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);

          function makeJwt() {
            const now = Math.floor(Date.now() / 1000);
            const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
            const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
            const input = `${hdr}.${pay}`;
            const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
            return `${input}.${sig.toString('base64url')}`;
          }

          function apiCall(method, path, body) {
            return new Promise((resolve, reject) => {
              const jwt = makeJwt();
              const opts = {
                hostname: 'api.appstoreconnect.apple.com',
                path: '/v1' + path,
                method,
                headers: {
                  'Authorization': `Bearer ${jwt}`,
                  'Content-Type': 'application/json',
                }
              };
              const req = https.request(opts, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
                  catch(e) { resolve({ status: res.statusCode, body: data }); }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function main() {
            // Get all apps
            const appsResp = await apiCall('GET', '/apps?limit=50&fields[apps]=name,bundleId');
            if (!appsResp.body.data) {
              console.log('ERROR: Could not fetch apps:', JSON.stringify(appsResp.body));
              process.exit(1);
            }
            const apps = appsResp.body.data;
            console.log(`=== Found ${apps.length} apps ===`);
            apps.forEach(a => console.log(`  ${a.attributes.name} (${a.id}) — ${a.attributes.bundleId}`));
            console.log('');

            for (const app of apps) {
              const appName = app.attributes.name;
              const appId = app.id;
              console.log(`--- Processing: ${appName} (${appId}) ---`);

              // Get all beta groups for this app
              const groupsResp = await apiCall('GET', `/apps/${appId}/betaGroups?limit=50`);
              if (!groupsResp.body.data) {
                console.log('  No beta groups (or error):', JSON.stringify(groupsResp.body).slice(0, 200));
                console.log('');
                continue;
              }
              const groups = groupsResp.body.data;
              if (groups.length === 0) {
                console.log('  No beta groups — skipping');
                console.log('');
                continue;
              }

              for (const group of groups) {
                const groupName = group.attributes.name;
                const groupId = group.id;
                const alreadyEnabled = group.attributes.feedbackEnabled;

                if (alreadyEnabled === true) {
                  console.log(`  [SKIP] ${groupName} — already enabled`);
                  continue;
                }

                const patchResp = await apiCall('PATCH', `/betaGroups/${groupId}`, {
                  data: { type: 'betaGroups', id: groupId, attributes: { feedbackEnabled: true } }
                });

                if (patchResp.status === 200 && patchResp.body.data?.attributes?.feedbackEnabled === true) {
                  console.log(`  [OK]   ${groupName} — feedback enabled`);
                } else {
                  console.log(`  [ERR]  ${groupName} — HTTP ${patchResp.status}`);
                  console.log('         ', JSON.stringify(patchResp.body).slice(0, 300));
                }
              }
              console.log('');
            }

            console.log('==========================================');
            console.log('Done — feedback enabled on all eligible beta groups');
            console.log('==========================================');
          }

          main().catch(e => { console.error('Fatal:', e); process.exit(1); });
          JSEOF
          node /tmp/enable_feedback.js
