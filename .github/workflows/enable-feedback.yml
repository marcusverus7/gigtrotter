name: Enable TestFlight Screenshot Feedback

on:
  workflow_dispatch:

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JWT
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/gen_jwt.js << 'JSEOF'
          const crypto = require('node:crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKeyPem = Buffer.from(process.env.ASC_KEY_P8, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);
          const now = Math.floor(Date.now() / 1000);
          const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
          const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
          const input = `${hdr}.${pay}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          JSEOF
          node /tmp/gen_jwt.js > /tmp/jwt.txt
          echo "JWT ready"

      - name: Enable feedback on Internal Testers group
        run: |
          JWT=$(cat /tmp/jwt.txt)
          BASE="https://api.appstoreconnect.apple.com/v1"
          GROUP_ID="29392d02-f5ea-4f47-a38a-bfbaf56f3c66"

          HTTP=$(curl -s -o /tmp/resp_int.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${JWT}" \
            -H "Content-Type: application/json" \
            "${BASE}/betaGroups/${GROUP_ID}" \
            -d "{\"data\":{\"type\":\"betaGroups\",\"id\":\"${GROUP_ID}\",\"attributes\":{\"feedbackEnabled\":true}}}")

          echo "Internal Testers HTTP: ${HTTP}"
          cat /tmp/resp_int.json | jq '{name:.data.attributes.name, feedbackEnabled:.data.attributes.feedbackEnabled}' 2>/dev/null || cat /tmp/resp_int.json

      - name: Enable feedback on Public Beta group
        run: |
          JWT=$(cat /tmp/jwt.txt)
          BASE="https://api.appstoreconnect.apple.com/v1"
          GROUP_ID="374b7066-0612-44ff-aaf3-52d644bd988b"

          HTTP=$(curl -s -o /tmp/resp_pub.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${JWT}" \
            -H "Content-Type: application/json" \
            "${BASE}/betaGroups/${GROUP_ID}" \
            -d "{\"data\":{\"type\":\"betaGroups\",\"id\":\"${GROUP_ID}\",\"attributes\":{\"feedbackEnabled\":true}}}")

          echo "Public Beta HTTP: ${HTTP}"
          cat /tmp/resp_pub.json | jq '{name:.data.attributes.name, feedbackEnabled:.data.attributes.feedbackEnabled}' 2>/dev/null || cat /tmp/resp_pub.json

          if [ "$HTTP" = "200" ]; then
            echo ""
            echo "=========================================="
            echo "SUCCESS — Screenshot feedback enabled on both groups"
            echo "Testers can now: take a screenshot in the app → tap Send Feedback"
            echo "Feedback arrives in App Store Connect → TestFlight → Feedback"
            echo "=========================================="
          else
            echo "Failed — HTTP ${HTTP}"
            exit 1
          fi
