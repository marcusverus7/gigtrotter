name: Fetch TestFlight & In-App Feedback

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JWT
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/gen_jwt.js << 'JSEOF'
          const crypto = require('node:crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKeyPem = Buffer.from(process.env.ASC_KEY_P8, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);
          const now = Math.floor(Date.now() / 1000);
          const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
          const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
          const input = `${hdr}.${pay}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          JSEOF
          node /tmp/gen_jwt.js > /tmp/jwt.txt
          echo "JWT ready (length: $(wc -c < /tmp/jwt.txt))"

      - name: List all accessible apps (raw)
        run: |
          JWT=$(cat /tmp/jwt.txt)
          echo "=== GET /v1/apps ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/apps?fields[apps]=bundleId,name&limit=10" \
            | tee /tmp/apps_raw.json
          echo ""
          echo "--- parsed ---"
          # Extract app ID if present
          APP_ID=$(cat /tmp/apps_raw.json | jq -r '.data[0].id // empty' 2>/dev/null || true)
          if [ -n "$APP_ID" ]; then
            echo "APP_ID=${APP_ID}" >> $GITHUB_ENV
            echo "Found app ID: ${APP_ID}"
            cat /tmp/apps_raw.json | jq '.data[] | {id:.id, name:.attributes.name, bundleId:.attributes.bundleId}' 2>/dev/null
          else
            echo "No app ID found in response — trying via builds endpoint"
          fi

      - name: Find app via builds (fallback if app list denied)
        run: |
          JWT=$(cat /tmp/jwt.txt)
          echo "=== GET /v1/builds (filter by bundleId) ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/builds?filter[bundleId]=com.gigtrotter.app&sort=-uploadedDate&limit=5&fields[builds]=version,uploadedDate,processingState" \
            | tee /tmp/builds_raw.json
          echo ""
          BUILD_ID=$(cat /tmp/builds_raw.json | jq -r '.data[0].id // empty' 2>/dev/null || true)
          if [ -n "$BUILD_ID" ]; then
            echo "LATEST_BUILD_ID=${BUILD_ID}" >> $GITHUB_ENV
            echo "Latest build: ${BUILD_ID}"
            cat /tmp/builds_raw.json | jq '.data[] | {id:.id, version:.attributes.version, uploaded:.attributes.uploadedDate}' 2>/dev/null
          else
            echo "No builds found via bundleId filter — trying via beta group"
          fi

      - name: Find builds via known beta group
        run: |
          JWT=$(cat /tmp/jwt.txt)
          PUBLIC_BETA_GROUP="374b7066-0612-44ff-aaf3-52d644bd988b"
          echo "=== Builds in Public Beta group ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/betaGroups/${PUBLIC_BETA_GROUP}/builds?limit=3&fields[builds]=version,uploadedDate,processingState" \
            | tee /tmp/group_builds.json
          echo ""
          BUILD_ID=$(cat /tmp/group_builds.json | jq -r '.data[0].id // empty' 2>/dev/null || true)
          if [ -n "$BUILD_ID" ] && [ -z "${LATEST_BUILD_ID}" ]; then
            echo "LATEST_BUILD_ID=${BUILD_ID}" >> $GITHUB_ENV
            echo "Build from group: ${BUILD_ID}"
          fi
          cat /tmp/group_builds.json | jq '.data[] | {id:.id, version:.attributes.version}' 2>/dev/null || true

      - name: Fetch beta feedback for build
        run: |
          JWT=$(cat /tmp/jwt.txt)
          if [ -z "${LATEST_BUILD_ID}" ]; then
            echo "No build ID available — cannot fetch build-specific feedback"
          else
            echo "=== Beta feedback for build ${LATEST_BUILD_ID} ==="
            curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -H "Authorization: Bearer ${JWT}" \
              "https://api.appstoreconnect.apple.com/v1/builds/${LATEST_BUILD_ID}/betaFeedbacks?limit=50" \
              | tee /tmp/build_feedback.json
            echo ""
          fi

          # Also try the top-level betaFeedbacks endpoint
          echo "=== GET /v1/betaFeedbacks (all) ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/betaFeedbacks?limit=50&fields[betaFeedbacks]=timestamp,comment,buildVersion,tester" \
            | tee /tmp/all_feedback.json
          echo ""
          echo "--- feedback items ---"
          cat /tmp/all_feedback.json | jq '
            if .data then
              "Total: \(.data | length)",
              (.data[] | {
                timestamp: .attributes.timestamp,
                comment: .attributes.comment,
                buildVersion: .attributes.buildVersion
              })
            else . end' 2>/dev/null || cat /tmp/all_feedback.json

      - name: List beta testers
        run: |
          JWT=$(cat /tmp/jwt.txt)
          echo "=== Beta testers in Public Beta group ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/betaGroups/374b7066-0612-44ff-aaf3-52d644bd988b/betaTesters?limit=50&fields[betaTesters]=email,firstName,lastName" \
            | jq '.data[] | "\(.attributes.firstName) \(.attributes.lastName) <\(.attributes.email)>"' 2>/dev/null || echo "(none or permission denied)"

          echo "=== Beta testers in Internal Testers group ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/betaGroups/29392d02-f5ea-4f47-a38a-bfbaf56f3c66/betaTesters?limit=50&fields[betaTesters]=email,firstName,lastName" \
            | jq '.data[] | "\(.attributes.firstName) \(.attributes.lastName) <\(.attributes.email)>"' 2>/dev/null || echo "(none or permission denied)"
