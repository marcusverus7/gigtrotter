name: Fetch TestFlight & In-App Feedback

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JWT
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/gen_jwt.js << 'JSEOF'
          const crypto = require('node:crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKeyPem = Buffer.from(process.env.ASC_KEY_P8, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);
          const now = Math.floor(Date.now() / 1000);
          const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
          const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
          const input = `${hdr}.${pay}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          JSEOF
          node /tmp/gen_jwt.js > /tmp/jwt.txt
          echo "JWT ready"

      - name: Get App ID for com.gigtrotter.app
        run: |
          JWT=$(cat /tmp/jwt.txt)
          curl -s \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.gigtrotter.app&fields[apps]=bundleId,name" \
            | jq '{app: .data[0] | {id: .id, name: .attributes.name, bundleId: .attributes.bundleId}}' \
            | tee /tmp/app.json

          APP_ID=$(cat /tmp/app.json | jq -r '.app.id')
          echo "APP_ID=${APP_ID}" >> $GITHUB_ENV
          echo "App ID: ${APP_ID}"

      - name: Get recent builds
        run: |
          JWT=$(cat /tmp/jwt.txt)
          curl -s \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=${APP_ID}&sort=-uploadedDate&limit=5&fields[builds]=version,uploadedDate,processingState,betaAppReviewSubmission" \
            | jq '.data[] | {id: .id, version: .attributes.version, uploaded: .attributes.uploadedDate, state: .attributes.processingState}' \
            | tee /tmp/builds.json
          echo "---"
          LATEST_BUILD_ID=$(curl -s \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=${APP_ID}&sort=-uploadedDate&limit=1&fields[builds]=version" \
            | jq -r '.data[0].id')
          echo "LATEST_BUILD_ID=${LATEST_BUILD_ID}" >> $GITHUB_ENV
          echo "Latest build: ${LATEST_BUILD_ID}"

      - name: Fetch TestFlight beta feedback (screenshot + written)
        run: |
          JWT=$(cat /tmp/jwt.txt)
          echo "=== BETA FEEDBACK FOR APP ${APP_ID} ==="
          HTTP=$(curl -s -o /tmp/feedback.json -w "%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/betaFeedbacks?filter[app]=${APP_ID}&limit=50&fields[betaFeedbacks]=timestamp,comment,screenshotData,tester,buildVersion")
          echo "HTTP: ${HTTP}"
          echo "--- feedback response ---"
          cat /tmp/feedback.json | jq '
            if .data then
              "Total feedback items: \(.data | length)",
              (.data[] | {
                id: .id,
                timestamp: .attributes.timestamp,
                comment: .attributes.comment,
                buildVersion: .attributes.buildVersion,
                hasScreenshot: (.attributes.screenshotData != null)
              })
            else
              .
            end' 2>/dev/null || cat /tmp/feedback.json

      - name: Fetch feedback for latest build specifically
        run: |
          JWT=$(cat /tmp/jwt.txt)
          echo "=== FEEDBACK ON BUILD ${LATEST_BUILD_ID} ==="
          HTTP=$(curl -s -o /tmp/build_feedback.json -w "%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/builds/${LATEST_BUILD_ID}/betaFeedbacks?limit=50")
          echo "HTTP: ${HTTP}"
          cat /tmp/build_feedback.json | jq '
            if .data then
              "Items: \(.data | length)",
              (.data[] | {
                id: .id,
                timestamp: .attributes.timestamp,
                comment: .attributes.comment,
                buildVersion: .attributes.buildVersion
              })
            else .
            end' 2>/dev/null || cat /tmp/build_feedback.json

      - name: List beta testers and their status
        run: |
          JWT=$(cat /tmp/jwt.txt)
          echo "=== BETA TESTERS ==="
          curl -s \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/betaTesters?filter[apps]=${APP_ID}&limit=50&fields[betaTesters]=email,firstName,lastName,inviteType,betaGroups" \
            | jq '.data[] | {
                email: .attributes.email,
                name: "\(.attributes.firstName) \(.attributes.lastName)",
                invite: .attributes.inviteType
              }' 2>/dev/null || echo "No testers found or permission denied"

      - name: Check beta groups and feedback enabled
        run: |
          JWT=$(cat /tmp/jwt.txt)
          echo "=== BETA GROUPS ==="
          curl -s \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/betaGroups?filter[app]=${APP_ID}&fields[betaGroups]=name,feedbackEnabled,publicLink,publicLinkEnabled,betaTesters" \
            | jq '.data[] | {
                id: .id,
                name: .attributes.name,
                feedbackEnabled: .attributes.feedbackEnabled,
                publicLink: .attributes.publicLink,
                publicLinkEnabled: .attributes.publicLinkEnabled
              }' 2>/dev/null
