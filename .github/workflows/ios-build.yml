name: iOS Build & Upload

# Builds the Capacitor iOS shell on a cloud macOS runner and uploads it to
# App Store Connect / TestFlight. Trigger manually from the Actions tab, or it
# runs automatically when the mobile shell or this workflow changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "ios-shell/**"
      - "ios/App/App/Assets.xcassets/**"
      - "fastlane/**"
      - "Gemfile"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications/Xcode*.app 2>/dev/null | sort || true

      # Select the latest available Xcode so we get the newest iOS SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show selected Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor web assets into committed iOS project
        run: npx cap sync ios

      - name: Set version and build number
        run: |
          cd ios/App
          agvtool new-marketing-version 1.0
          agvtool new-version -all ${{ github.run_number }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # Capacitor 8 defaults to Swift Package Manager, so a Podfile usually
      # won't exist. Only run pod install when the project actually uses pods.
      - name: Install CocoaPods dependencies (if needed)
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          else
            echo "No Podfile found — project uses Swift Package Manager, skipping pod install."
          fi

      - name: Build and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane release

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gigtrotter-ipa
          path: "**/*.ipa"
          if-no-files-found: ignore
