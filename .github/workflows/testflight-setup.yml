name: TestFlight Public Beta Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JWT
        id: jwt
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/gen_jwt.js << 'JSEOF'
          const crypto = require('node:crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const rawKey = process.env.ASC_KEY_P8;
          // Key is stored base64-encoded (fastlane uses is_key_content_base64: true)
          const privateKeyPem = Buffer.from(rawKey, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);
          const now = Math.floor(Date.now() / 1000);
          const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
          const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
          const input = `${hdr}.${pay}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          JSEOF
          node /tmp/gen_jwt.js > /tmp/jwt.txt
          echo "JWT generated. Length: $(wc -c < /tmp/jwt.txt) bytes"
          echo "jwt_file=/tmp/jwt.txt" >> "$GITHUB_OUTPUT"

      - name: List beta groups
        run: |
          JWT=$(cat /tmp/jwt.txt)
          APP_ID="6781050707"
          BASE="https://api.appstoreconnect.apple.com/v1"
          # --globoff (-g) prevents curl from interpreting [] as glob patterns
          curl -sg -H "Authorization: Bearer ${JWT}" \
            "${BASE}/apps/${APP_ID}/betaGroups?fields%5BbetaGroups%5D=name,isInternalGroup,publicLinkEnabled,publicLink,publicLinkId" \
            | jq '.data[] | {id:.id, name:.attributes.name, internal:.attributes.isInternalGroup, linkEnabled:.attributes.publicLinkEnabled, link:.attributes.publicLink}'

      - name: Get latest valid build
        run: |
          JWT=$(cat /tmp/jwt.txt)
          APP_ID="6781050707"
          BASE="https://api.appstoreconnect.apple.com/v1"
          # Use percent-encoded brackets to avoid curl glob parsing
          BUILD_RESP=$(curl -sg -H "Authorization: Bearer ${JWT}" \
            "${BASE}/builds?filter%5Bapp%5D=${APP_ID}&filter%5BprocessingState%5D=VALID&sort=-uploadedDate&limit=5")
          echo "$BUILD_RESP" | jq '.data[] | {id:.id, version:.attributes.version, uploaded:.attributes.uploadedDate}'
          BUILD_ID=$(echo "$BUILD_RESP" | jq -r '.data[0].id')
          BUILD_VER=$(echo "$BUILD_RESP" | jq -r '.data[0].attributes.version')
          echo "BUILD_ID=${BUILD_ID}" >> "$GITHUB_ENV"
          echo "BUILD_VER=${BUILD_VER}" >> "$GITHUB_ENV"
          echo "Using build ID: ${BUILD_ID} (version ${BUILD_VER})"

      - name: Add build to Public Beta group
        run: |
          JWT=$(cat /tmp/jwt.txt)
          GROUP_ID="374b7066-0612-44ff-aaf3-52d644bd988b"
          BASE="https://api.appstoreconnect.apple.com/v1"
          HTTP=$(curl -s -o /tmp/add_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Content-Type: application/json" \
            "${BASE}/betaGroups/${GROUP_ID}/relationships/builds" \
            -d "{\"data\":[{\"type\":\"builds\",\"id\":\"${BUILD_ID}\"}]}")
          echo "HTTP status: ${HTTP}"
          cat /tmp/add_resp.json

      - name: Enable public link and print URL
        run: |
          JWT=$(cat /tmp/jwt.txt)
          GROUP_ID="374b7066-0612-44ff-aaf3-52d644bd988b"
          BASE="https://api.appstoreconnect.apple.com/v1"
          PATCH=$(curl -s -X PATCH \
            -H "Authorization: Bearer ${JWT}" \
            -H "Content-Type: application/json" \
            "${BASE}/betaGroups/${GROUP_ID}" \
            -d "{\"data\":{\"type\":\"betaGroups\",\"id\":\"${GROUP_ID}\",\"attributes\":{\"publicLinkEnabled\":true,\"publicLinkLimitEnabled\":false}}}")
          echo "$PATCH" | jq .
          PUBLIC_LINK_ID=$(echo "$PATCH" | jq -r '.data.attributes.publicLinkId // empty')
          PUBLIC_LINK=$(echo "$PATCH" | jq -r '.data.attributes.publicLink // empty')
          echo ""
          echo "=========================================="
          echo "TESTFLIGHT PUBLIC LINK:"
          echo "https://testflight.apple.com/join/${PUBLIC_LINK_ID}"
          if [ -n "$PUBLIC_LINK" ]; then
            echo "API full URL: ${PUBLIC_LINK}"
          fi
          echo "NOTE: Link activates after Beta App Review (24-48 hrs)"
          echo "=========================================="
