name: Bootstrap ToneScout in App Store Connect

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Create ToneScout app in ASC + copy secrets to tonescout repo
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          cat > /tmp/bootstrap.js << 'JSEOF'
          const https = require('node:https');
          const crypto = require('node:crypto');

          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKeyPem = Buffer.from(process.env.ASC_KEY_P8, 'base64').toString('utf8');
          const privateKey = crypto.createPrivateKey(privateKeyPem);
          const ghToken = process.env.GH_TOKEN;

          // Print key details in encoded form (bypass masking, these are not sensitive)
          console.log('KEY_ID_B64:', Buffer.from(keyId).toString('base64'));
          console.log('ISSUER_B64:', Buffer.from(issuerId).toString('base64'));

          function makeJwt() {
            const now = Math.floor(Date.now() / 1000);
            const hdr = Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
            const pay = Buffer.from(JSON.stringify({iss:issuerId,iat:now,exp:now+1200,aud:'appstoreconnect-v1'})).toString('base64url');
            const input = `${hdr}.${pay}`;
            const sig = crypto.sign('sha256', Buffer.from(input), {key: privateKey, dsaEncoding: 'ieee-p1363'});
            return `${input}.${sig.toString('base64url')}`;
          }

          function ascCall(method, path, body) {
            return new Promise((resolve, reject) => {
              const jwt = makeJwt();
              const opts = {
                hostname: 'api.appstoreconnect.apple.com',
                path: '/v1' + path,
                method,
                headers: {
                  'Authorization': `Bearer ${jwt}`,
                  'Content-Type': 'application/json',
                }
              };
              const req = https.request(opts, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
                  catch(e) { resolve({ status: res.statusCode, body: data }); }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          function ghCall(method, path, body) {
            return new Promise((resolve, reject) => {
              const opts = {
                hostname: 'api.github.com',
                path,
                method,
                headers: {
                  'Authorization': `Bearer ${ghToken}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'tonescout-bootstrap',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                }
              };
              const req = https.request(opts, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
                  catch(e) { resolve({ status: res.statusCode, body: data }); }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          // Encrypt a secret value using libsodium (nacl)
          // GitHub requires secrets encrypted with the repo's public key
          async function encryptSecret(publicKeyB64, secretValue) {
            // Use Node.js crypto to do NaCl box encryption
            // We need tweetnacl or sodium-native. Let's use a pure-JS approach.
            // Actually, let's use the GitHub API with a workaround: use gh CLI via child_process
            const { execSync } = require('node:child_process');
            // Write secret to file and use gh CLI
            return null; // We'll use gh CLI instead
          }

          async function setGhSecret(repo, secretName, secretValue) {
            const { execFileSync } = require('node:child_process');
            try {
              // execFileSync avoids shell interpretation of special chars in the value
              const env = { ...process.env, GH_TOKEN: ghToken, GITHUB_TOKEN: ghToken };
              execFileSync('gh', ['secret', 'set', secretName, '--repo', repo, '--body', secretValue], { env, stdio: 'pipe' });
              return true;
            } catch(e) {
              console.error(`Failed to set ${secretName}:`, e.stderr?.toString() || e.message);
              return false;
            }
          }

          async function main() {
            // Step 1: Check if ToneScout exists in ASC
            console.log('=== Step 1: Checking ASC apps ===');
            const appsResp = await ascCall('GET', '/apps?limit=50&fields[apps]=name,bundleId');
            if (!appsResp.body.data) {
              console.error('ERROR fetching apps:', JSON.stringify(appsResp.body));
              process.exit(1);
            }
            const apps = appsResp.body.data;
            apps.forEach(a => console.log(`  ${a.attributes.name} (${a.id}) - ${a.attributes.bundleId}`));

            let tonescoutApp = apps.find(a => a.attributes.bundleId === 'com.tonescout.app');
            if (tonescoutApp) {
              console.log(`ToneScout already exists: ${tonescoutApp.id}`);
            } else {
              console.log('\n=== Step 2: Creating ToneScout in ASC ===');
              const createResp = await ascCall('POST', '/apps', {
                data: {
                  type: 'apps',
                  attributes: {
                    bundleId: 'com.tonescout.app',
                    name: 'ToneScout',
                    primaryLocale: 'en-US',
                    sku: 'TONESCOUT001',
                    usesThirdPartyContent: false,
                    availableInNewTerritories: true,
                  }
                }
              });
              console.log('Create HTTP:', createResp.status);
              if (createResp.status === 201) {
                tonescoutApp = createResp.body.data;
                console.log('Created ToneScout:', tonescoutApp.id);
              } else {
                console.log('Create response:', JSON.stringify(createResp.body).slice(0, 500));
                // Try to get bundle ID if already exists differently
              }
            }

            // Step 3: Copy ASC secrets to ToneScout repo
            console.log('\n=== Step 3: Setting ASC secrets in ToneScout repo ===');
            const secrets = [
              ['ASC_KEY_ID', process.env.ASC_KEY_ID],
              ['ASC_ISSUER_ID', process.env.ASC_ISSUER_ID],
              ['ASC_KEY_P8', process.env.ASC_KEY_P8],
              // Reuse GigTrotter match repo so ToneScout picks up the existing
              // distribution cert instead of trying to create a new one (Apple
              // caps distribution certs at 2 per team).
              ['MATCH_GIT_URL', process.env.MATCH_GIT_URL],
              ['MATCH_PASSWORD', process.env.MATCH_PASSWORD],
              ['MATCH_GIT_BASIC_AUTHORIZATION', process.env.MATCH_GIT_BASIC_AUTHORIZATION],
            ];

            for (const [name, value] of secrets) {
              const ok = await setGhSecret('marcusverus7/tonescout', name, value);
              console.log(`  ${name}: ${ok ? 'SET' : 'FAILED'}`);
            }

            console.log('\n=== Done ===');
            if (tonescoutApp) {
              console.log('ToneScout App ID:', tonescoutApp.id);
            }
          }

          main().catch(e => { console.error('Fatal:', e); process.exit(1); });
          JSEOF

          # Install gh CLI if not present (it is on ubuntu-latest)
          gh --version

          node /tmp/bootstrap.js
